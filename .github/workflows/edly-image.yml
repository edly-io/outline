name: Edly image

# Builds the Edly fork of Outline and publishes it to the GitHub Container
# Registry. Pull requests into `edly` only build the image to check that it
# still builds, pushes to `edly` and `edly-v*` tags publish it.
on:
  push:
    branches: [edly]
    tags: ["edly-v*"]
  pull_request:
    branches: [edly]
  workflow_dispatch:

concurrency:
  group: edly-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/outline

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The app image is built on top of the base image, which holds the
      # compiled app and production dependencies. The base image is exported to
      # a local OCI layout and passed to the app build as a named context, so it
      # is never pushed.
      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/base,tar=false
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/edly-v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ env.PUSH == 'true' }}
          build-args: |
            BASE_IMAGE=edly-outline-base
          build-contexts: |
            edly-outline-base=oci-layout://${{ runner.temp }}/base
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
